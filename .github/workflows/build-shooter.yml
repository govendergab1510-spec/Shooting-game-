          func _add_action_btn(txt: String, offset_br: Vector2, sz: Vector2, cb: Callable) -> void:
          	var b := Button.new()
          	b.text = txt
          	b.set_anchors_preset(Control.PRESET_BOTTOM_RIGHT)
          	b.offset_left = offset_br.x
          	b.offset_right = offset_br.x + sz.x
          	b.offset_top = offset_br.y
          	b.offset_bottom = offset_br.y + sz.y
          	b.pressed.connect(cb)
          	_hud.add_child(b)

          func _make_panel() -> PanelContainer:
          	var p := PanelContainer.new()
          	p.set_anchors_preset(Control.PRESET_CENTER)
          	p.custom_minimum_size = Vector2(580, 0)
          	p.grow_horizontal = Control.GROW_DIRECTION_BOTH
          	p.grow_vertical = Control.GROW_DIRECTION_BOTH
          	var sb := StyleBoxFlat.new()
          	sb.bg_color = Color(0.08, 0.09, 0.12, 0.90)
          	sb.border_color = Color(1.0, 0.55, 0.18, 0.9)
          	sb.set_border_width_all(2)
          	sb.set_corner_radius_all(14)
          	sb.set_content_margin_all(24)
          	p.add_theme_stylebox_override("panel", sb)
          	var v := VBoxContainer.new()
          	v.name = "VBox"
          	v.add_theme_constant_override("separation", 12)
          	p.add_child(v)
          	return p

          func _start_match() -> void:
          	for b in _bots:
          		if is_instance_valid(b):
          			b.queue_free()
          	_bots.clear()
          	for s in _shot_pool:
          		s["life"] = 0.0
          		s["node"].visible = false
          	for tr in _tracer_pool:
          		tr["life"] = 0.0
          		tr["node"].visible = false
          	for pk in _pickups:
          		pk.queue_free()
          	_pickups.clear()
          	for g in _grenades:
          		g["node"].queue_free()
          	_grenades.clear()

          	_arena.spawn_barrels()
          	_player.reset_player()
          	_score = 0
          	_kills = 0
          	_combo = 1
          	_combo_timer = 0.0
          	_wave = 1
          	_begin_wave(1)

          	_menu_panel.visible = false
          	_gameover_panel.visible = false
          	_hud.visible = true
          	_state = State.PLAYING
          	_refresh_hud()

          func _begin_wave(w: int) -> void:
          	_wave = w
          	_to_spawn = 4 + w * 2
          	_spawn_cd = 0.8
          	_show_banner("WAVE %d • HOSTILES INBOUND" % w, 2.4)
          	_refresh_hud()

          func _show_banner(txt: String, dur: float) -> void:
          	_lbl_banner.text = txt
          	_lbl_banner.visible = true
          	_banner_timer = dur

          func _refresh_hud() -> void:
          	var spec: Dictionary = _player.get_spec()
          	var idx: int = _player.weapon_idx
          	var r_txt := " (RELOADING)" if _player.is_reloading else ""
          	_lbl_hp.text = "HP %d  •  ARMOR %d  •  NADE x%d" % [_player.hp, _player.armor, _player.grenades]
      
