name: Build Outpost Zero (Quaternius Animations + Poly Haven + ElevenLabs)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  APK_NAME: "OutpostZero-Redmi13C.apk"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Upgraded Outpost Zero Project
        run: |
          mkdir -p scenes scripts tools assets/polyhaven assets/animations assets/models assets/sfx build

          if [ ! -f project.godot ]; then
          cat << 'EOF' > .gitignore
          .godot/
          build/
          *.apk
          *.aab
          EOF

          cat << 'EOF' > project.godot
          ; Engine configuration file.
          config_version=5

          [application]

          config/name="Outpost Zero"
          config/description="PS3-optimized 3rd-Person Tactical Shooter with Quaternius CC0 animations, Poly Haven 1K PBR, and ElevenLabs SFX."
          run/main_scene="res://scenes/Main.tscn"
          config/features=PackedStringArray("4.7", "GL Compatibility")
          config/icon="res://icon.svg"
          run/max_fps=60

          [autoload]

          AudioBank="*res://scripts/AudioBank.gd"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          window/handheld/orientation=0
          window/vsync/vsync_mode=1

          [input_devices]

          pointing/emulate_touch_from_mouse=false

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          scaling_3d/scale=0.85
          lights_and_shadows/directional_shadow/size=1024
          lights_and_shadows/directional_shadow/soft_shadow_filter_quality=0
          EOF

          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tools/*,build/*,.github/*"
          export_path="build/OutpostZero-Redmi13C.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=3
          version/name="3.0.0"
          package/unique_name="com.outpostzero.shooter"
          package/name="Outpost Zero"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/internet=true
          permissions/vibrate=true
          EOF

          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#191b22"/>
                <stop offset="100%" stop-color="#3a2314"/>
              </linearGradient>
            </defs>
            <rect width="192" height="192" rx="36" fill="url(#bg)"/>
            <circle cx="96" cy="96" r="54" fill="none" stroke="#ff8c2a" stroke-width="10"/>
            <line x1="96" y1="24" x2="96" y2="60" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
            <line x1="96" y1="132" x2="96" y2="168" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
            <line x1="24" y1="96" x2="60" y2="96" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
            <line x1="132" y1="96" x2="168" y2="96" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
            <circle cx="96" cy="96" r="9" fill="#ff8c2a"/>
          </svg>
          EOF

          cat << 'EOF' > scenes/Main.tscn
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/Main.gd" id="1_main"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1_main")
          EOF

          cat << 'EOF' > tools/fetch_assets.py
          import io
          import json
          import os
          import urllib.request
          import urllib.error
          import zipfile

          UA = {"User-Agent": "OutpostZeroBuilder/3.0"}

          POLY_MODELS = [
              "covered_car",
              "concrete_road_barrier",
              "concrete_road_barrier_02",
              "wooden_crate_01",
              "plastic_crate_02",
              "cardboard_box_01",
              "portable_generator",
              "propane_tank",
              "metal_trash_can",
              "fire_hydrant",
              "metal_jerrycan_green",
              "exterior_aircon_unit",
          ]

          POLY_TEXTURES = [
              "asphalt_02",
              "concrete_pavement",
              "brick_wall_001",
              "corrugated_iron",
              "concrete_wall_008",
          ]

          POLY_HDRI = "industrial_sunset_02_puresky"

          QUATERNIUS_PACKS = [
              (
                  "UAL1_Standard.glb",
                  "https://quaternius.itch.io/universal-animation-library/file/17958403?source=game_download&as_props=1",
                  "Unreal-Godot/UAL1_Standard.glb",
              ),
              (
                  "UAL2_Standard.glb",
                  "https://quaternius.itch.io/universal-animation-library-2/file/17958478?source=game_download&as_props=1",
                  "Unreal-Godot/UAL2_Standard.glb",
              ),
          ]

          BACKUP_SOLDIER_URL = "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb"

          SFX_SPECS = [
              ("sfx_rifle.mp3", "Single punchy modern tactical assault rifle gunshot with crisp bolt snap, urban street echo", 0.7, 0.65, False),
              ("sfx_shotgun.mp3", "Heavy 12 gauge tactical pump shotgun blast with deep punch and shell rack", 1.0, 0.65, False),
              ("sfx_pistol.mp3", "Sharp crisp tactical 9mm handgun gunshot in city alley", 0.6, 0.65, False),
              ("sfx_reload.mp3", "Metallic assault rifle magazine eject, crisp mag click insert, bolt rack", 1.4, 0.60, False),
              ("sfx_hit.mp3", "Short sharp tactical shooter hitmarker tick", 0.5, 0.70, False),
              ("sfx_headshot.mp3", "Metallic helmet impact crunch with sharp critical hit chime", 0.6, 0.70, False),
              ("sfx_explosion.mp3", "Powerful propane cylinder and frag grenade explosion on city street with deep bass shockwave", 2.2, 0.60, False),
              ("sfx_enemy_fire.mp3", "Distant urban rifle gunshot crack echoing off brick buildings", 0.7, 0.60, False),
              ("sfx_hurt.mp3", "Heavy Kevlar body armor bullet impact thud", 0.6, 0.60, False),
              ("sfx_ambience.mp3", "Subtle late afternoon downtown industrial street wind ambience with faint distant city hum", 8.0, 0.50, True),
          ]

          def fetch_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode("utf-8"))

          def download_file(url, dest):
              if os.path.exists(dest) and os.path.getsize(dest) > 256:
                  return True
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = r.read()
              with open(dest, "wb") as f:
                  f.write(data)
              return True

          def safe_join(base, rel):
              norm = os.path.normpath(rel).replace("\\", "/")
              if norm.startswith("..") or os.path.isabs(norm):
                  raise ValueError(f"Unsafe path: {rel}")
              return os.path.join(base, norm)

          def download_quaternius_animations():
              os.makedirs("assets/animations", exist_ok=True)
              any_ok = False
              for out_name, post_url, suffix in QUATERNIUS_PACKS:
                  dest = os.path.join("assets/animations", out_name)
                  if os.path.exists(dest) and os.path.getsize(dest) > 100000:
                      print(f"[Quaternius] Cached {out_name}")
                      any_ok = True
                      continue
                  try:
                      req = urllib.request.Request(
                          post_url,
                          data=b"",
                          headers={"User-Agent": UA["User-Agent"], "Accept": "application/json"},
                          method="POST",
                      )
                      with urllib.request.urlopen(req, timeout=45) as r:
                          info = json.loads(r.read().decode("utf-8"))
                      dl_url = info.get("url")
                      if not dl_url:
                          print(f"[Quaternius] No signed url for {out_name}")
                          continue
                      dl_req = urllib.request.Request(dl_url, headers=UA)
                      with urllib.request.urlopen(dl_req, timeout=120) as zr:
                          zip_bytes = zr.read()
                      with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                          match = None
                          for member in zf.namelist():
                              norm_m = member.replace("\\", "/")
                              if norm_m.endswith(suffix) or (norm_m.endswith("/" + out_name) and "_RM" not in norm_m):
                                  match = member
                                  break
                          if match:
                              with open(dest, "wb") as out_f:
                                  out_f.write(zf.read(match))
                              print(f"[Quaternius] Extracted {out_name} ({os.path.getsize(dest)} bytes)")
                              any_ok = True
                          else:
                              print(f"[Quaternius] {out_name} not found inside zip")
                  except Exception as e:
                      print(f"[Quaternius] Warning fetching {out_name}: {e}")

              if not any_ok:
                  try:
                      download_file(BACKUP_SOLDIER_URL, "assets/models/Soldier.glb")
                      print("[Backup] Downloaded Three.js Soldier.glb fallback")
                  except Exception as e:
                      print(f"[Backup] Soldier fallback warning: {e}")

          def download_polyhaven():
              for slug in POLY_MODELS:
                  out_dir = f"assets/polyhaven/{slug}"
                  gltf_path = os.path.join(out_dir, "model.gltf")
                  if os.path.exists(gltf_path) and os.path.getsize(gltf_path) > 256:
                      continue
                  try:
                      files = fetch_json(f"https://api.polyhaven.com/files/{slug}")
                      g = files.get("gltf", {}).get("1k", {}).get("gltf")
                      if not g:
                          continue
                      download_file(g["url"], gltf_path)
                      for rel, info in g.get("include", {}).items():
                          download_file(info["url"], safe_join(out_dir, rel))
                      print(f"[PolyHaven] Downloaded 1K model: {slug}")
                  except Exception as e:
                      print(f"[PolyHaven] Model warning {slug}: {e}")

              for slug in POLY_TEXTURES:
                  out_dir = f"assets/polyhaven/{slug}"
                  if os.path.exists(os.path.join(out_dir, "diff.jpg")):
                      continue
                  try:
                      files = fetch_json(f"https://api.polyhaven.com/files/{slug}")
                      for api_key, out_name in [("Diffuse", "diff.jpg"), ("nor_gl", "nor.jpg"), ("Rough", "rough.jpg")]:
                          node = files.get(api_key, {}).get("1k", {})
                          fmt = "jpg" if "jpg" in node else ("png" if "png" in node else None)
                          if fmt:
                              download_file(node[fmt]["url"], os.path.join(out_dir, out_name))
                      print(f"[PolyHaven] Downloaded 1K texture: {slug}")
                  except Exception as e:
                      print(f"[PolyHaven] Texture warning {slug}: {e}")

              sky_dest = "assets/polyhaven/sky_1k.hdr"
              if not os.path.exists(sky_dest):
                  try:
                      files = fetch_json(f"https://api.polyhaven.com/files/{POLY_HDRI}")
                      download_file(files["hdri"]["1k"]["hdr"]["url"], sky_dest)
                      print(f"[PolyHaven] Downloaded 1K Sunset HDRI: {POLY_HDRI}")
                  except Exception as e:
                      print(f"[PolyHaven] HDRI warning: {e}")

          def download_elevenlabs():
              api_key = os.environ.get("ELEVENLABS_API_KEY", "").strip()
              if not api_key:
                  print("[ElevenLabs] ELEVENLABS_API_KEY secret not set. Procedural audio fallback will be used.")
                  return

              os.makedirs("assets/sfx", exist_ok=True)
              url = "https://api.elevenlabs.io/v1/sound-generation"
              headers = {
                  "xi-api-key": api_key,
                  "Content-Type": "application/json",
                  "Accept": "audio/mpeg",
              }

              for fname, prompt, dur, inf, is_loop in SFX_SPECS:
                  dest = os.path.join("assets/sfx", fname)
                  if os.path.exists(dest) and os.path.getsize(dest) > 1024:
                      continue
                  payload = {
                      "text": prompt,
                      "duration_seconds": dur,
                      "prompt_influence": inf,
                      "model_id": "eleven_text_to_sound_v2",
                  }
                  if is_loop:
                      payload["loop"] = True
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers=headers, method="POST")
                      with urllib.request.urlopen(req, timeout=60) as r:
                          audio_bytes = r.read()
                      if len(audio_bytes) > 512:
                          with open(dest, "wb") as f:
                              f.write(audio_bytes)
                          print(f"[ElevenLabs] Generated {fname} ({len(audio_bytes)} bytes)")
                  except urllib.error.HTTPError as e:
                      print(f"[ElevenLabs] HTTP {e.code} for {fname}: {e.read().decode('utf-8', errors='ignore')[:160]}")
                  except Exception as e:
                      print(f"[ElevenLabs] Warning for {fname}: {e}")

          if __name__ == "__main__":
              download_quaternius_animations()
              download_polyhaven()
              download_elevenlabs()
          EOF

          cat << 'EOF' > scripts/AudioBank.gd
          extends Node

          var _players: Array[AudioStreamPlayer] = []
          var _next_idx: int = 0
          var _ambience: AudioStreamPlayer
          var _streams: Dictionary = {}
          var muted: bool = false

          const SFX_FILES := {
          	"rifle": "res://assets/sfx/sfx_rifle.mp3",
          	"shotgun": "res://assets/sfx/sfx_shotgun.mp3",
          	"pistol": "res://assets/sfx/sfx_pistol.mp3",
          	"reload": "res://assets/sfx/sfx_reload.mp3",
          	"hit": "res://assets/sfx/sfx_hit.mp3",
          	"headshot": "res://assets/sfx/sfx_headshot.mp3",
          	"explosion": "res://assets/sfx/sfx_explosion.mp3",
          	"enemy_fire": "res://assets/sfx/sfx_enemy_fire.mp3",
          	"hurt": "res://assets/sfx/sfx_hurt.mp3",
          }

          func _ready() -> void:
          	for i in range(10):
          		var p := AudioStreamPlayer.new()
          		p.volume_db = -3.0
          		add_child(p)
          		_players.append(p)

          	for key in SFX_FILES.keys():
          		var path: String = SFX_FILES[key]
          		if ResourceLoader.exists(path):
          			var s := load(path)
          			if s is AudioStream:
          				_streams[key] = s

          	if not _streams.has("rifle"):
          		_streams["rifle"] = _make_punch(180.0, 45.0, 0.14, 0.55)
          	if not _streams.has("shotgun"):
          		_streams["shotgun"] = _make_punch(130.0, 32.0, 0.28, 0.70)
          	if not _streams.has("pistol"):
          		_streams["pistol"] = _make_punch(260.0, 70.0, 0.11, 0.45)
          	if not _streams.has("reload"):
          		_streams["reload"] = _make_tone(640.0, 880.0, 0.12, 0.25)
          	if not _streams.has("hit"):
          		_streams["hit"] = _make_tone(1250.0, 900.0, 0.05, 0.30)
          	if not _streams.has("headshot"):
          		_streams["headshot"] = _make_tone(1500.0, 2100.0, 0.09, 0.38)
          	if not _streams.has("explosion"):
          		_streams["explosion"] = _make_punch(90.0, 22.0, 0.55, 0.85)
          	if not _streams.has("enemy_fire"):
          		_streams["enemy_fire"] = _make_punch(220.0, 60.0, 0.12, 0.30)
          	if not _streams.has("hurt"):
          		_streams["hurt"] = _make_punch(140.0, 40.0, 0.18, 0.50)

          	_ambience = AudioStreamPlayer.new()
          	_ambience.volume_db = -14.0
          	add_child(_ambience)
          	if ResourceLoader.exists("res://assets/sfx/sfx_ambience.mp3"):
          		var amb := load("res://assets/sfx/sfx_ambience.mp3")
          		if amb is AudioStreamMP3:
          			(amb as AudioStreamMP3).loop = true
          			_ambience.stream = amb
          			_ambience.play()

          func play(key: String, vol_db: float = -2.0, pitch_jitter: float = 0.05) -> void:
          	if muted or not _streams.has(key):
          		return
          	var p := _players[_next_idx]
          	_next_idx = (_next_idx + 1) % _players.size()
          	p.stream = _streams[key]
          	p.volume_db = vol_db
          	p.pitch_scale = randf_range(1.0 - pitch_jitter, 1.0 + pitch_jitter)
          	p.play()

          func _make_punch(f0: float, f1: float, dur: float, amp: float) -> AudioStreamWAV:
          	var rate := 22050
          	var n := int(dur * rate)
          	var data := PackedByteArray()
          	data.resize(n * 2)
          	var phase := 0.0
          	var lp := 0.0
          	for i in range(n):
          		var t := float(i) / float(n)
          		phase += TAU * lerpf(f0, f1, t) / float(rate)
          		var env := pow(1.0 - t, 2.2)
          		lp = lerpf(lp, randf_range(-1.0, 1.0), 0.45)
          		var s := (sin(phase) * 0.45 + lp * 0.55) * env * amp
          		data.encode_s16(i * 2, int(clampf(s, -1.0, 1.0) * 32767.0))
          	var w := AudioStreamWAV.new()
          	w.format = AudioStreamWAV.FORMAT_16_BITS
          	w.mix_rate = rate
          	w.data = data
          	return w

          func _make_tone(f0: float, f1: float, dur: float, amp: float) -> AudioStreamWAV:
          	var rate := 22050
          	var n := int(dur * rate)
          	var data := PackedByteArray()
          	cat << 'EOF' > scripts/SoldierVisual.gd
          extends Node3D

          var anim_player: AnimationPlayer
          var muzzle_marker: Marker3D
          var _clips: Dictionary = {}
          var _current_locomotion: String = ""
          var _action_timer: float = 0.0
          var _is_dead: bool = false

          static var _cached_ual2_lib: AnimationLibrary = null
          static var _ual2_checked: bool = false

          const UAL1_PATH := "res://assets/animations/UAL1_Standard.glb"
          const UAL2_PATH := "res://assets/animations/UAL2_Standard.glb"
          const BACKUP_PATH := "res://assets/models/Soldier.glb"

          func build_soldier(uniform_col: Color, armor_col: Color, visor_col: Color, scale_mult: float = 1.0) -> void:
          	var loaded := false
          	var model_path := UAL1_PATH if ResourceLoader.exists(UAL1_PATH) else (BACKUP_PATH if ResourceLoader.exists(BACKUP_PATH) else "")

          	if not model_path.is_empty():
          		var packed := load(model_path)
          		if packed is PackedScene:
          			var model: Node3D = packed.instantiate()
          			model.rotation.y = PI
          			model.scale = Vector3.ONE * scale_mult
          			add_child(model)
          			_apply_tactical_skin(model, uniform_col)
          			anim_player = _find_anim_player(model)
          			var skel := _find_skeleton(model)
          			if anim_player != null:
          				_merge_ual2_library(skel)
          				_index_animations()
          			_attach_tactical_gear(skel, model, armor_col, visor_col)
          			loaded = true

          	if not loaded:
          		_build_fallback(uniform_col, armor_col, visor_col, scale_mult)

          func _find_anim_player(node: Node) -> AnimationPlayer:
          	if node is AnimationPlayer:
          		return node as AnimationPlayer
          	for c in node.get_children():
          		var res := _find_anim_player(c)
          		if res != null:
          			return res
          	return null

          func _find_skeleton(node: Node) -> Skeleton3D:
          	if node is Skeleton3D:
          		return node as Skeleton3D
          	for c in node.get_children():
          		var res := _find_skeleton(c)
          		if res != null:
          			return res
          	return null

          func _merge_ual2_library(target_skel: Skeleton3D) -> void:
          	if _ual2_checked:
          		if _cached_ual2_lib != null and not anim_player.has_animation_library("ual2"):
          			anim_player.add_animation_library("ual2", _cached_ual2_lib)
          		return
          	_ual2_checked = true
          	if not ResourceLoader.exists(UAL2_PATH) or target_skel == null:
          		return
          	var p2 := load(UAL2_PATH)
          	if not (p2 is PackedScene):
          		return
          	var inst: Node3D = p2.instantiate()
          	var ap2 := _find_anim_player(inst)
          	if ap2 != null and ap2.has_animation_library(""):
          		var root_node := anim_player.get_node(anim_player.root_node)
          		var target_skel_path := String(root_node.get_path_to(target_skel))
          		var lib := ap2.get_animation_library("").duplicate(true) as AnimationLibrary
          		for anim_name in lib.get_animation_list():
          			var anim := lib.get_animation(anim_name)
          			if anim == null:
          				continue
          			for t in range(anim.get_track_count()):
          				var tp := String(anim.track_get_path(t))
          				var colon := tp.find(":")
          				if colon != -1:
          					anim.track_set_path(t, NodePath(target_skel_path + tp.substr(colon)))
          		_cached_ual2_lib = lib
          		anim_player.add_animation_library("ual2", _cached_ual2_lib)
          	inst.queue_free()

          func _index_animations() -> void:
          	var all_names := anim_player.get_animation_list()
          	for full_name in all_names:
          		var low := full_name.to_lower()
          		var anim := anim_player.get_animation(full_name)
          		if anim != null:
          			if "loop" in low or low == "idle" or low == "walk" or low == "run" or "aim" in low:
          				anim.loop_mode = Animation.LOOP_LINEAR
          			else:
          				anim.loop_mode = Animation.LOOP_NONE

          	_pick_clip(all_names, "idle", ["pistol_idle_loop", "idle_loop", "idle"])
          	_pick_clip(all_names, "aim_idle", ["pistol_aim", "pistol_idle_loop", "idle_loop"])
          	_pick_clip(all_names, "walk", ["walk_loop", "walk"])
          	_pick_clip(all_names, "jog", ["jog_fwd_loop", "walk_loop", "run"])
          	_pick_clip(all_names, "sprint", ["sprint_loop", "jog_fwd_loop", "run"])
          	_pick_clip(all_names, "crouch_idle", ["crouch_idle_loop", "crouch_idle", "idle_loop"])
          	_pick_clip(all_names, "crouch_walk", ["crouch_fwd_loop", "crouch_walk", "walk_loop"])
          	_pick_clip(all_names, "jump", ["jump_start", "jump_loop", "jump"])
          	_pick_clip(all_names, "roll", ["roll", "slide", "sprint_loop"])
          	_pick_clip(all_names, "shoot", ["pistol_shoot"])
          	_pick_clip(all_names, "reload", ["pistol_reload"])
          	_pick_clip(all_names, "hit_chest", ["hit_chest", "hit"])
          	_pick_clip(all_names, "hit_head", ["hit_head", "hit_chest"])
          	_pick_clip(all_names, "death", ["death01", "death"])

          	set_locomotion("idle")

          func _pick_clip(all_names: PackedStringArray, key: String, patterns: Array[String]) -> void:
          	for pat in patterns:
          		for full_name in all_names:
          			var short := full_name.get_slice("/", 1) if "/" in full_name else full_name
          			if short.to_lower() == pat:
          				_clips[key] = full_name
          				return
          	for pat in patterns:
          		for full_name in all_names:
          			if pat in full_name.to_lower():
          				_clips[key] = full_name
          				return

          func set_locomotion(state: String) -> void:
          	if _is_dead or anim_player == null or _action_timer > 0.0 or _current_locomotion == state:
          		return
          	if _clips.has(state):
          		_current_locomotion = state
          		anim_player.play(_clips[state], 0.16)

          func play_action(action_key: String, lock_time: float = 0.45, force_death: bool = false) -> void:
          	if anim_player == null:
          		return
          	if _is_dead and not force_death:
          		return
          	if force_death:
          		_is_dead = true
          		_action_timer = 999.0
          	else:
          		_action_timer = lock_time
          	_current_locomotion = ""
          	if _clips.has(action_key):
          		var cname: String = _clips[action_key]
          		anim_player.stop()
          		anim_player.play(cname, 0.08)

          func _process(delta: float) -> void:
          	if _action_timer > 0.0 and not _is_dead:
          		_action_timer -= delta
          		if _action_timer <= 0.0:
          			set_locomotion("idle")

