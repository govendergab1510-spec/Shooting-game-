          	elif spd > 0.45:
          		_visual.set_locomotion("walk")
          	else:
          		_visual.set_locomotion("idle")

          	_fire_cd -= delta
          	if _fire_cd <= 0.0 and dist < 34.0:
          		_fire_cd = fire_rate * randf_range(0.85, 1.2)
