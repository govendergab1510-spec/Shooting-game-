name: Build Outpost Zero Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  APK_NAME: "OutpostZero-Redmi13C.apk"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Quaternius, Poly Haven & ElevenLabs Assets
        uses: actions/cache@v4
        with:
          path: assets
          key: outpost-gta-assets-v3-${{ hashFiles('tools/fetch_assets.py') }}

      - name: Download Assets & ElevenLabs SFX
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/fetch_assets.py

      - name: Package Full Project Zip
        run: |
          mkdir -p build
          zip -r build/OutpostZero-Project.zip .gitignore project.godot export_presets.cfg icon.svg scenes scripts tools assets .github

      - uses: actions/upload-artifact@v4
        with:
          name: OutpostZero-Project-ZIP
          path: build/OutpostZero-Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android Platform 35 & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-linux-android

      - name: Download Godot ${{ env.GODOT_TAG }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_TAG }}/Godot_v${{ env.GODOT_TAG }}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${{ env.GODOT_TAG }}_linux.x86_64
          rm godot.zip
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_TAG }}/Godot_v${{ env.GODOT_TAG }}_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}/
          rm -rf templates.tpz /tmp/godot_tpl

      - name: Generate Keystore & Import Assets
        run: |
          mkdir -p ~/.android ~/.config/godot
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          ~/godot-bin/Godot_v${{ env.GODOT_TAG }}_linux.x86_64 --headless --import
          cat <<EOF > ~/.config/godot/editor_settings-${{ env.GODOT_VERSION }}.tres
          [godot_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-${{ env.GODOT_VERSION }}.tres ~/.config/godot/editor_settings-4.7.tres || true

      - name: Export Android APK
        env:
          GODOT_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
        run: |
          ~/godot-bin/Godot_v${{ env.GODOT_TAG }}_linux.x86_64 --headless --export-debug "Android" "build/${{ env.APK_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OutpostZero-Redmi13C-APK
          path: build/*.apk
